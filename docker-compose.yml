services:
  postgres:
    image: postgres:16-alpine
    container_name: synapse-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse_erp
    ports:
      - "5433:5432"
    volumes:
      - synapse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synapse -d synapse_erp']
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  synapse_pgdata:
